[package]
name = "tempo-mac"
version = "0.2.0"
description = "Tempo for Mac (07): the native client"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "Tempo"

[lib]
name = "tempo_mac"
path = "src/lib.rs"

[[bin]]
name = "Tempo"
path = "src/main.rs"

[[bin]]
name = "tempo"
path = "src/bin/tempo.rs"

[[example]]
name = "s11_transcript"
path = "examples/s11_transcript.rs"

[features]
# Spike S11: GPUI frame-time histograms (draw p99) for the transcript example.
profiler = ["gpui-kit/profiler"]

[dependencies]
async-channel = "=2.5.0"
gpui-kit = { version = "=0.7.1" }
resvg = "=0.48.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempo-terminal = { path = "../../crates/tempo-terminal" }
tempo-client = { path = "../../crates/tempo-client" }
tempo-protocol = { path = "../../crates/tempo-protocol" }
serde_yaml_ng = "=0.10.0"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSDockTile",
  "NSResponder",
  "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSBundle",
  "NSDictionary",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
security-framework = { version = "=3.7.0", default-features = false }
