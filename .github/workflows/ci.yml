name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Container versions agree (01, Container image)
        run: bun run check:versions
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - name: Build tempod
        run: bun run build:tempod
      - name: Build the app
        run: bun run --cwd apps/tempo build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install browser engines
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Web client acceptance with local protocol fixtures
        run: bun run test:web
      - name: Existing workspace browser regressions
        run: bun run --cwd tests/e2e test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-acceptance-traces
          path: |
            tests/e2e/test-results/
            tests/e2e/web-test-results/
