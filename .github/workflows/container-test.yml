name: Daemon image tests

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - "packages/tempod/**"
      - "packages/protocol/**"
      - "packages/settings/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "patches/**"
      - "turbo.json"
      - "scripts/test-tempod-container.ts"
      - ".github/workflows/container-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daemon-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:tempod:container
