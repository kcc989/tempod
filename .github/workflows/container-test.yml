name: Daemon image tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:tempod:container
