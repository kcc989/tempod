[package]
name = "tempo-client"
version = "0.1.0"
description = "Tempo for Mac (07): tokio runtime, RPC client, channel clients, reconnect, device sign-in"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 07 Testing, End to end: `cargo test -p tempo-client --features e2e` with TEMPO_E2E_URL and TEMPO_E2E_TOKEN.
e2e = []

[dependencies]
tempo-protocol = { path = "../tempo-protocol" }
async-channel = "=2.5.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }

[[test]]
name = "e2e"
required-features = ["e2e"]

[dev-dependencies]
tokio = { version = "=1.53.2", features = [
  "rt-multi-thread",
  "net",
  "time",
  "sync",
  "macros",
  "io-util",
  "test-util",
] }
